# dxf-converter v2: credentials for the dxf-converter bucket on AIStor
# (TrueNAS, S3 API at http://192.168.0.10:30320 — the console on :30321 is not the API).
# Endpoint and bucket are not secret and go in the chart's values.yaml; only the keys live here.
#
# Fill in a copy outside the repo, apply it, then delete the copy:
#   cp example-secrets/dxf-converter/secret.yml /tmp/dxf-secret.yml   # edit the two keys
#   kubectl apply -f /tmp/dxf-secret.yml && rm /tmp/dxf-secret.yml
#
apiVersion: v1
kind: Secret
metadata:
  name: dxf-converter-bucket-credentials
  namespace: dxf-converter
type: Opaque
stringData:
  S3_ACCESS_KEY: "CHANGE_ME_ACCESS_KEY"
  S3_SECRET_KEY: "CHANGE_ME_SECRET_KEY"
---
# dxf-converter v2: database connection for accounts and saved scans.
# Role and database `dxfconv` on the cluster postgres (namespace postgres).
apiVersion: v1
kind: Secret
metadata:
  name: dxf-converter-db
  namespace: dxf-converter
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dxfconv:CHANGE_ME_PASSWORD@postgres.postgres.svc.cluster.local:5432/dxfconv"
---
# dxf-converter 3.0: authentik OIDC client secret. The same random value goes in both
# Secrets: authentik reads it (blueprints/dxf-converter.yaml), the app presents it.
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
apiVersion: v1
kind: Secret
metadata:
  name: dxf-converter-oidc
  namespace: dxf-converter
type: Opaque
stringData:
  client_secret: "CHANGE_ME_CLIENT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-dxf-converter-oidc
  namespace: authentik
type: Opaque
stringData:
  client_secret: "CHANGE_ME_CLIENT_SECRET"
