# Template for the slashdot-news Postgres credentials. Fill in a copy outside the repo,
# apply it, delete it:
#   cp example-secrets/slashdot-news/secret.yml /tmp/sd-secret.yml   # edit the value
#   kubectl apply -f /tmp/sd-secret.yml && rm /tmp/sd-secret.yml
#
# Database: role and database `slashdot_news` on the pgvector postgres
# (postgres/init-slashdot-news.sql), host postgres-pgvector.postgres.svc.cluster.local
# port 5432. DATABASE_URL is a postgresql URL with user slashdot_news, the generated
# password, that host, and database slashdot_news — see init-slashdot-news.sql header
# for the exact kubectl commands.
apiVersion: v1
kind: Secret
metadata:
  name: slashdot-news-db
  namespace: slashdot-news
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME_DATABASE_URL"
