# nodewright: hand-applied secrets. Fill in a copy outside the repo, apply it, delete it:
#   cp example-secrets/nodewright/secret.yml /tmp/nw-secret.yml   # edit the values
#   kubectl apply -f /tmp/nw-secret.yml && rm /tmp/nw-secret.yml
#
# Database: role and database `nodewright` on the cluster postgres (namespace postgres),
# the role owning the database.
apiVersion: v1
kind: Secret
metadata:
  name: nodewright-db
  namespace: nodewright
type: Opaque
stringData:
  # postgresql URL: user nodewright, the generated password, host
  # postgres.postgres.svc.cluster.local port 5432, database nodewright.
  DATABASE_URL: "CHANGE_ME_DATABASE_URL"
---
# authentik OIDC client secret. The same random value goes in both Secrets: authentik
# reads it (blueprints/nodewright.yaml), the app presents it.
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
apiVersion: v1
kind: Secret
metadata:
  name: nodewright-oidc
  namespace: nodewright
type: Opaque
stringData:
  client_secret: "CHANGE_ME_CLIENT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-nodewright-oidc
  namespace: authentik
type: Opaque
stringData:
  client_secret: "CHANGE_ME_CLIENT_SECRET"
---
# AIStor credentials for the `nodewright` bucket (attachments). Endpoint and bucket are in the
# chart's values.yaml (attachments.*).
apiVersion: v1
kind: Secret
metadata:
  name: nodewright-bucket-credentials
  namespace: nodewright
type: Opaque
stringData:
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
