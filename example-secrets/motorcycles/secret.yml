# Template for the motorcycle parts reference DB credentials.
# Real values: the `motorcycle_parts` role password set by
# postgres/init-motorcycle-parts.sql (never commit it).
# Apply to BOTH namespaces:
#   kubectl -n motorcycles-dev apply -f secret.yml
#   kubectl -n motorcycles     apply -f secret.yml
apiVersion: v1
kind: Secret
metadata:
  name: motorcycle-parts-credentials
  namespace: motorcycles-dev   # change to `motorcycles` for the prod namespace
type: Opaque
stringData:
  MOTORCYCLE_USER: motorcycle_parts
  MOTORCYCLE_PASSWORD: changeme
