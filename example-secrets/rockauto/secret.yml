# Template for the rockauto catalogue DB credentials.
# Real values: the `rockauto` role password set by postgres/init-rockauto.sql
# (never commit it).
# Apply to the rockauto-dev namespace:
#   kubectl -n rockauto-dev apply -f secret.yml
apiVersion: v1
kind: Secret
metadata:
  name: rockauto-credentials
  namespace: rockauto-dev
type: Opaque
stringData:
  ROCKAUTO_USER: rockauto
  ROCKAUTO_PASSWORD: changeme
