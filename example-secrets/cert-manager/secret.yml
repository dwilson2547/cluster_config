# Cloudflare API token for cert-manager's DNS-01 solver (ClusterIssuers
# letsencrypt-staging / letsencrypt-prod). Token permissions:
#   Zone / Zone / Read  +  Zone / DNS / Edit, scoped to danwils.com.
# Apply by hand; never commit the real value.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: replace-me
