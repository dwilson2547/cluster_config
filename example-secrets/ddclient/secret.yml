apiVersion: v1
kind: Secret
metadata:
  name: ddclient-secret
  namespace: dns
  labels:
    app: ddclient
stringData:
  ddclient.conf: |
    daemon=300
    syslog=yes
    use=web
    web=https://cloudflare.com/cdn-cgi/trace
    web-skip='ip='
    ssl=yes

    protocol=cloudflare
    zone=example.com
    ttl=1
    password={cloudflare-api-token}
    example.com
    # mqtt.example.com: raw-TCP endpoint for the phone gateway (RouterOS dst-nat
    # WAN 48213 -> mosquitto 8883). MUST stay DNS-only (grey cloud) in Cloudflare —
    # the free plan does not proxy raw TCP. Create the record once by hand with
    # proxy off; ddclient then keeps only the IP current. external-dns does not
    # manage this record (it only touches records labelled dns.danwils.com/public=true).
    mqtt.example.com
