# kubectl apply -f example-secrets/tailscale/secret.yml   (with the real key; never commit it)
# Auth key from the Tailscale admin console (Settings > Keys). Only used for first login.
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: tailscale
type: Opaque
stringData:
  TS_AUTHKEY: tskey-auth-REPLACE_ME
