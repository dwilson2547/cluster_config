# authentik configuration secrets, read by the chart via authentik.existingSecret.
# Apply by hand; never commit real values.
#   AUTHENTIK_SECRET_KEY: openssl rand -base64 60 | tr -d '\n'   (never change after first install)
#   AUTHENTIK_POSTGRESQL__PASSWORD: must match the `authentik` role on postgres/postgres
#   AUTHENTIK_BOOTSTRAP_*: create the akadmin user on first start, so the initial-setup
#     flow is never left open on a public hostname. Ignored after the first start.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: authentik
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: replace-me
  AUTHENTIK_POSTGRESQL__PASSWORD: replace-me
  AUTHENTIK_BOOTSTRAP_PASSWORD: replace-me
  AUTHENTIK_BOOTSTRAP_EMAIL: replace-me
