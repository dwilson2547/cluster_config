# Cloudflare API token for external-dns (danwils.com records for opted-in Ingresses).
# Permissions: Zone / Zone / Read + Zone / DNS / Edit, scoped to danwils.com.
# Apply by hand; never commit the real value.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-danwils
  namespace: external-dns
type: Opaque
stringData:
  api-token: replace-me
