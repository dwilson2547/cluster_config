# Copy to a local file, fill in real values, then:
#   kubectl apply -f <your-filled-file>
# Do NOT commit the filled version.
#
# tower-share-creds is required before the web-workflows worker can mount the
# share. The web-workflows-plex secret below is optional (Plex scans are
# disabled in the chart; refresh the library manually in Plex).

# SMB mount credentials for \\TOWER\Share (192.168.0.15).
# Referenced by nodeStageSecretRef on the tower-share PV - the CSI driver
# stages these onto the node; they never appear in any path or values file.
apiVersion: v1
kind: Secret
metadata:
  name: tower-share-creds
  namespace: web-workflows
type: Opaque
stringData:
  username: "CHANGE_ME_tower_user"
  password: "CHANGE_ME_tower_password"
  # domain is optional; set it if the share authenticates against a domain
  # domain: "TOWER"
---
# Plex scans are currently disabled in the chart (plex.enabled: false) — the
# library is refreshed manually in Plex. The secret below is only needed if
# plex is re-enabled.
apiVersion: v1
kind: Secret
metadata:
  name: web-workflows-plex
  namespace: web-workflows
type: Opaque
stringData:
  WW_PLEX_URL: "http://192.168.0.15:32400"
  WW_PLEX_TOKEN: "CHANGE_ME_plex_token"
---
# Optional: lets the web-workflows ai-worker submit ai-page jobs to the
# cluster's gpu-scheduler. The token is this app's own client entry
# (`web-workflows:<token>`) in the gpu-scheduler-tokens Secret
# (ai/gpu-scheduler/helm/gpu-scheduler/values.yaml `tokensSecret`).
# Chart: helm/web-workflows values `gpu.tokenSecret`.
apiVersion: v1
kind: Secret
metadata:
  name: web-workflows-gpu-scheduler
  namespace: web-workflows
type: Opaque
stringData:
  token: "CHANGE_ME_gpu_scheduler_client_token"
---
# Optional: knowledge-store sink — finished AI summaries are pushed to webdoc
# (apps/webdoc) as notes over its MCP endpoint. The token is a personal access
# token (wdp_…) from webdoc's Agents page; `domain` in values must be one the
# token may write to. Chart: values `webdoc.*`.
apiVersion: v1
kind: Secret
metadata:
  name: web-workflows-webdoc
  namespace: web-workflows
type: Opaque
stringData:
  token: "CHANGE_ME_webdoc_pat"
