# Template for the nightly offsite bucket copy (offsite-backup/objects.yaml). Fill in and apply; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: offsite-objects
  namespace: offsite-backup
type: Opaque
stringData:
  # The read-only AIStor key, same values as postgres/object-backup-s3 (S3_ACCESS_KEY / S3_SECRET_KEY).
  AISTOR_ACCESS_KEY: "replace-me"
  AISTOR_SECRET_KEY: "replace-me"
  # rclone crypt password and salt, each passed through `rclone obscure -`. Keep both plain values off-cluster
  # (password manager): without them the offsite copy is unreadable. `rclone reveal <obscured>` recovers a value.
  CRYPT_PASSWORD: "replace-me"
  CRYPT_PASSWORD2: "replace-me"
