# webdoc: hand-applied secrets. Fill in a copy outside the repo, apply it, delete it:
#   cp example-secrets/webdoc/secret.yml /tmp/wd-secret.yml   # edit the values
#   kubectl apply -f /tmp/wd-secret.yml && rm /tmp/wd-secret.yml
#
# Database: role and database `webdoc` on the pgvector postgres (postgres/init-webdoc.sql),
# the role owning the database.
apiVersion: v1
kind: Secret
metadata:
  name: webdoc-db
  namespace: webdoc
type: Opaque
stringData:
  # postgresql URL: user webdoc, the generated password, host
  # postgres-pgvector.postgres.svc.cluster.local port 5432, database webdoc.
  DATABASE_URL: "CHANGE_ME_DATABASE_URL"
---
# authentik OIDC client secret. The same random value goes in both Secrets: authentik
# reads it (blueprints/webdoc.yaml), the app presents it.
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
apiVersion: v1
kind: Secret
metadata:
  name: webdoc-oidc
  namespace: webdoc
type: Opaque
stringData:
  client_secret: "CHANGE_ME_CLIENT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-webdoc-oidc
  namespace: authentik
type: Opaque
stringData:
  client_secret: "CHANGE_ME_CLIENT_SECRET"
