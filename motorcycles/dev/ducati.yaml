# Ducati OEM parts via the Ducati Omaha / Issuu catalogue SVGs (no browser, no
# PDFs, no OCR — Issuu's per-page SVG renders carry a text layer for both
# born-digital catalogues and scans). Writes to the shared motorcycle_parts
# database; reader4.json + page SVGs via webcache, subsystem images via
# imgcache, target requests paced by request-auth. Resume-safe (scraped_at).
# NOTE: timeout is 5m for the initial verification run; restore to 8h (prod
# value) once the run has been checked.

apiVersion: scrape.danwils.com/v1alpha1
kind: Scraper
metadata:
  name: ducati
  namespace: motorcycles-dev
spec:
  image: dwilson2547/motorcycle-scraper-ducati@sha256:153f4981901672374483423dd1965e002e58306fe2ed9224539f9b5e57627941
  imagePullPolicy: IfNotPresent
  timeout: 5m
  env:
    # Order matters: $(VAR) only expands variables defined earlier in the list.
    - name: MOTORCYCLE_USER
      valueFrom: {secretKeyRef: {name: motorcycle-parts-credentials, key: MOTORCYCLE_USER}}
    - name: MOTORCYCLE_PASSWORD
      valueFrom: {secretKeyRef: {name: motorcycle-parts-credentials, key: MOTORCYCLE_PASSWORD}}
    - name: MOTORCYCLE_DATABASE_URL
      value: "postgresql://$(MOTORCYCLE_USER):$(MOTORCYCLE_PASSWORD)@postgres.postgres.svc.cluster.local:5432/motorcycle_parts"
    - {name: WEBCACHE_URL, value: "http://webcache.scrapestack-dev.svc.cluster.local:8000"}
    - {name: IMGCACHE_URL, value: "http://imgcache.scrapestack-dev.svc.cluster.local:8010"}
    - {name: REQUEST_AUTH_SERVER_URL, value: "request-auth-server.scrapestack-dev.svc.cluster.local:9000"}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
  policy:
    concurrency: 1
    spacing: {min: 10m, jitter: 15m}
    retry: {attempts: 3, backoff: {initial: 5m, factor: 3, max: 2h}}
    suspendAfter: 3
  # A completed reference catalogue legitimately yields zero new items on
  # later runs, so zero-result and drop detection stay off.
  health:
    minItems: 0
    maxDropPct: 100
---
apiVersion: scrape.danwils.com/v1alpha1
kind: ScrapeJob
metadata:
  name: ducati
  namespace: motorcycles-dev
spec:
  scraperRef: ducati
  poolRef: motorcycle-parts
