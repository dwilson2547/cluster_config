crds:
  enabled: false

# microk8s runs kube-proxy, the scheduler and the controller manager inside kubelite, and uses dqlite rather than
# etcd: there is nothing to scrape, so their Down alerts fire forever. Off.
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
defaultRules:
  disabled:
    # Replaced by monitoring/manifests/cluster-alerts.yaml, which leaves out scrape-job-manager's retried Jobs.
    KubeJobFailed: true
alertmanager:
  alertmanagerSpec:
    # Pick up AlertmanagerConfig CRs from any namespace (e.g. the postgres-backup
    # email config in postgres/). The operator routes each config by its own namespace.
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    # Root route and receivers: the cluster-wide config in monitoring/manifests/cluster-alerts.yaml.
    alertmanagerConfiguration:
      name: cluster-alerts
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi
          storageClassName: nfs-dataset
grafana:
  initChownData:
    enabled: false
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: nfs-dataset
  sidecar:
    skipTlsVerify: true
    # Folders from the grafana_folder annotation on each dashboard ConfigMap; no annotation = General.
    # `annotations` is applied to the chart's own dashboards only.
    dashboards:
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: Kubernetes
      provider:
        foldersFromFilesStructure: true
  # Sign-in only through authentik (authentik/blueprints/grafana.yaml); no login form.
  # Basic auth stays on for the API: the datasource sidecar reloads provisioning
  # with the chart's admin credentials (secret prometheus-grafana).
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client_secret
  grafana.ini:
    server:
      root_url: https://grafana.danwils.com
    security:
      cookie_secure: true
    auth:
      disable_login_form: true
      signout_redirect_url: https://auth.danwils.com/application/o/grafana/end-session/
    auth.anonymous:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: authentik
      icon: signin
      client_id: grafana
      scopes: openid email profile offline_access
      auth_url: https://auth.danwils.com/application/o/authorize/
      token_url: https://auth.danwils.com/application/o/token/
      api_url: https://auth.danwils.com/application/o/userinfo/
      use_pkce: true
      use_refresh_token: true
      auto_login: true
      allow_sign_up: true
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      # Re-evaluated at every sign-in; no matching group = refused (authentik refuses first).
      role_attribute_path: >-
        contains(groups[*], 'grafana-admins') && 'GrafanaAdmin' ||
        contains(groups[*], 'grafana-editors') && 'Editor' ||
        contains(groups[*], 'grafana-viewers') && 'Viewer'
      role_attribute_strict: true
      allow_assign_grafana_admin: true
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
          storageClassName: nfs-dataset
