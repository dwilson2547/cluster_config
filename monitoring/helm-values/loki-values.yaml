# helm repo add grafana-community https://grafana-community.github.io/helm-charts
# helm repo update
# helm install loki grafana-community/loki --namespace monitoring -f loki-values.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  # Keep 90 days: the compactor deletes older chunks (without it Loki keeps everything and fills its 50 GiB
  # volume eventually). Scraper logs measured ~10-20 MB/day uncompressed on 2026-10-17 (⚠ estimate from the
  # pods kept then). Helm merges this into the chart's limits_config defaults.
  limits_config:
    retention_period: 2160h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    storageClass: nfs-dataset
    size: 50Gi

# Disable microservice components (not needed in SingleBinary mode)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable self-monitoring to avoid grafana-agent operator dependency
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

lokiCanary:
  enabled: false

test:
  enabled: false

# microk8s self-signed CA lacks Key Usage extension — Python SSL rejects it
sidecar:
  skipTlsVerify: true
