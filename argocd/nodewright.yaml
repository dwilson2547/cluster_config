apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodewright
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/nodewright.git
    targetRevision: main
    path: helm/nodewright
  destination:
    server: https://kubernetes.default.svc
    namespace: nodewright
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
