apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smb-csi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-smb/master/charts
    chart: csi-driver-smb
    targetRevision: 1.20.3
    helm:
      values: |
        controller:
          replicas: 1
        node:
          # microk8s (snap-confined) kubelet dir - the chart default
          # /var/lib/kubelet makes NodePublishVolume mounts land where the
          # kubelet cannot stat them (matches the working csi-nfs-node DS).
          kubelet: /var/snap/microk8s/common/var/lib/kubelet
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
