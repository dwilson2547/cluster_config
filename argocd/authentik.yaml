apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.8.3
      helm:
        releaseName: authentik
        valueFiles:
          - $values/authentik/values.yaml
    - repoURL: git@github.com:dwilson2547/cluster_config.git
      targetRevision: main
      ref: values
    # Blueprints ConfigMap (kustomize), mounted via blueprints.configMaps.
    - repoURL: git@github.com:dwilson2547/cluster_config.git
      targetRevision: main
      path: authentik/blueprints
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
