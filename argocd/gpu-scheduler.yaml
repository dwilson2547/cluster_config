apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-scheduler
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dwilson2547/gpu-scheduler.git
    targetRevision: main
    path: helm/gpu-scheduler
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-scheduler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
