apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrape-stack-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dwilson2547/scrape_stack.git
    targetRevision: dev
    path: helm/scrape-stack
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: scrapestack-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
