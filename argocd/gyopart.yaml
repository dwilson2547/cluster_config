apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gyopart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/gyopart.git
    targetRevision: main
    path: helm/gyopart
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml   # prod-only: the scraper fleet (values.yaml is merged into every env)
  destination:
    server: https://kubernetes.default.svc
    namespace: gyopart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
