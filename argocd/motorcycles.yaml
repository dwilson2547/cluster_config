apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: motorcycles
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dwilson2547/cluster_config.git
    targetRevision: main
    path: motorcycles/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: motorcycles
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
