apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gen-ai-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/gen-ai-platform.git
    targetRevision: main
    path: helm/gen-ai-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: gen-ai-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
