apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scrape-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dwilson2547/scrape_stack.git
    targetRevision: main
    path: helm/scrape-stack
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: scrape-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
