apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dwilson2547/incident-operator.git
    targetRevision: main
    path: helm/incident-operator
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: incident-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
