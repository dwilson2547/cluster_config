apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webdoc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/webdoc.git
    targetRevision: main
    path: helm/webdoc
  destination:
    server: https://kubernetes.default.svc
    namespace: webdoc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
