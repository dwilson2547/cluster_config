apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-workflows
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:dwilson2547/web-workflows.git
    targetRevision: main
    path: helm/web-workflows
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: web-workflows
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
