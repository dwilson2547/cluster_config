# Traefik ingress controller (chart pinned in argocd/traefik.yaml).
# Originally installed by the microk8s ingress addon; adopted into Argo 2026-10-10
# with these values unchanged. Never run `microk8s disable ingress`: it deletes
# these Argo-managed resources.
#
# DaemonSet on every node with hostPorts 80/443, plus the LoadBalancer service
# (MetalLB, 192.168.0.60, pinned below) for the LAN, and a second LoadBalancer
# `traefik-public` (192.168.0.65) carrying only the public entrypoints. Serves IngressClasses traefik, public (default) and
# nginx (nginx-annotation compatibility via the kubernetesIngressNginx provider).
deployment:
  kind: DaemonSet
# hostPorts 80/443 mean a surge pod can never schedule next to the old one, so
# the chart default (maxSurge 1, maxUnavailable 0) wedges every rollout Pending.
# Replace one node at a time instead; the LB keeps routing to the other pods.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
extraObjects:
# Public-entrypoint middlewares (pubweb/pubsecure defaults above). Every public
# router gets them, in order: lockdown, concurrency cap, rate limit.
# Origin lockdown: WAN 80/443 is forwarded here, so without this anyone who finds
# the home IP skips Cloudflare. ipAllowList checks the TCP peer (not X-Forwarded-For),
# which is a Cloudflare edge for real visitors. LAN stays allowed (hairpin, admin), and
# so do pods: DanWiki/photo-dump/dxf-converter reach authentik through this service
# via hostAliases. Keep the Cloudflare ranges in sync with forwardedHeaders.trustedIPs.
- apiVersion: traefik.io/v1alpha1
  kind: Middleware
  metadata:
    name: public-origin-lockdown
    namespace: ingress
  spec:
    ipAllowList:
      sourceRange:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
        - 192.168.0.0/24    # LAN (nodes .35-.37, router hairpin)
        - 10.1.0.0/16       # pod CIDR (calico default-ipv4-ippool)
# Per-visitor limits. depth: 1 is the rightmost X-Forwarded-For entry: Cloudflare appends
# the real visitor there, and Traefik strips the header from untrusted peers, so it
# can't be spoofed (LAN/pod traffic has none and shares one "" bucket). The default
# (TCP peer) would put every visitor behind one Cloudflare edge in the same bucket.
# Generous on purpose: a flood guard, not a quota. Apps add stricter limits on
# expensive routes (e.g. dxf-converter's uploads).
- apiVersion: traefik.io/v1alpha1
  kind: Middleware
  metadata:
    name: public-inflight
    namespace: ingress
  spec:
    inFlightReq:
      amount: 100
      sourceCriterion:
        ipStrategy:
          depth: 1
          ipv6Subnet: 64
- apiVersion: traefik.io/v1alpha1
  kind: Middleware
  metadata:
    name: public-ratelimit
    namespace: ingress
  spec:
    rateLimit:
      average: 100
      period: 1s
      burst: 300
      sourceCriterion:
        ipStrategy:
          depth: 1
          ipv6Subnet: 64
- apiVersion: networking.k8s.io/v1
  kind: IngressClass
  metadata:
    annotations:
      ingressclass.kubernetes.io/is-default-class: "true"
    name: public
  spec:
    controller: traefik.io/ingress-controller
- apiVersion: networking.k8s.io/v1
  kind: IngressClass
  metadata:
    name: nginx
  spec:
    controller: traefik.io/ingress-controller
gateway:
  listeners:
    web:
      namespacePolicy:
        from: All
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
    - web
    matchRule: Host(`dashboard.localhost`)
ports:
  # Internal (LAN) entrypoints on 192.168.0.60. asDefault: a router that names no
  # entrypoint binds only to these, so every existing Ingress stays LAN-only.
  web:
    asDefault: true
    exposedPort: 80
    hostPort: 80
    port: 8000
    protocol: TCP
  websecure:
    asDefault: true
    exposedPort: 443
    hostPort: 443
    port: 8443
    protocol: TCP
  # Public entrypoints, exposed only on the `public` Service (192.168.0.65), which
  # the router forwards WAN 80/443 to. Nothing is served here unless its Ingress
  # opts in with: traefik.ingress.kubernetes.io/router.entrypoints: pubsecure
  pubweb:
    port: 8001
    exposedPort: 80
    protocol: TCP
    expose:
      default: false
      public: true
    redirections:
      entryPoint:
        to: pubsecure
        scheme: https
        permanent: true
    # Edge protection for everything public (docs/public_edge_protection.md).
    middlewares: &publicMiddlewares
      - ingress-public-origin-lockdown@kubernetescrd
      - ingress-public-inflight@kubernetescrd
      - ingress-public-ratelimit@kubernetescrd
    # Behind Cloudflare: trust X-Forwarded-For only from Cloudflare's edge, so
    # backends see the visitor's IP rather than a node or edge address (authentik's
    # per-IP login reputation needs it). Ranges: https://www.cloudflare.com/ips/
    # (fetched 2026-10-10). Needs externalTrafficPolicy: Local on `public` below,
    # or the source arrives SNATed to a node IP and matches none of these.
    forwardedHeaders:
      trustedIPs: &cloudflare
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  pubsecure:
    port: 8444
    exposedPort: 443
    protocol: TCP
    expose:
      default: false
      public: true
    tls:
      enabled: true
    forwardedHeaders:
      trustedIPs: *cloudflare
    middlewares: *publicMiddlewares
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    allowEmptyServices: true
    enabled: true
    publishedService:
      enabled: true
  kubernetesIngressNginx:
    enabled: true
service:
  additionalServices:
    public:
      type: LoadBalancer
      single: true
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.0.65
      spec:
        # Keep the client source IP (a Cloudflare edge address) instead of SNATing
        # it to the node; safe because the DaemonSet has a pod on every node.
        externalTrafficPolicy: Local
  annotations:
    # Pinned so the ingress IP can't move: dns.yaml's zones and the router's 80/443
    # forward point here. (Was a hand-run `kubectl annotate` before 2026-10-10.)
    metallb.universe.tf/loadBalancerIPs: 192.168.0.60
