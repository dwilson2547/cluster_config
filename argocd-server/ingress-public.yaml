# Public ArgoCD at https://argocd.danwils.com (traefik-public, pubsecure). Applied by hand:
#   kubectl apply -f argocd-server/ingress-public.yaml
#
# Sign-in from the internet is SSO only (authentik). The local `admin` account stays enabled
# but its password login is refused on this host: the two endpoints that accept a
# username/password are routed through a middleware that returns 403. argocd.local
# (ingress.yaml, LAN) is untouched, so admin still works there as break-glass.
# Endpoints from server/session/session.proto at v3.4.2; re-check them on ArgoCD upgrades.
# Full layout: docs/argocd_access.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
  namespace: argocd
spec:
  # No real client ever arrives from 127.0.0.1 through traefik-public, so this refuses every request.
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-public
  namespace: argocd
  labels:
    dns.danwils.com/public: "true"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: pubsecure
    external-dns.kubernetes.io/target: danwils.com
spec:
  ingressClassName: traefik
  tls:
    - secretName: argocd-danwils-tls
      hosts:
        - argocd.danwils.com
  rules:
    - host: argocd.danwils.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
          # The UI calls this to check whether it is signed in; it must outrank the
          # /api/v1/session block below (Traefik prefers the longer rule).
          - path: /api/v1/session/userinfo
            pathType: Exact
            backend:
              service:
                name: argocd-server
                port:
                  name: http
---
# Local-account login (REST + gRPC/gRPC-web SessionService.Create). 403 on the public host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-public-deny-local-login
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: pubsecure
    traefik.ingress.kubernetes.io/router.middlewares: argocd-deny-all@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: argocd-danwils-tls
      hosts:
        - argocd.danwils.com
  rules:
    - host: argocd.danwils.com
      http:
        paths:
          - path: /api/v1/session
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
          - path: /session.SessionService/Create
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
