apiVersion: v1
kind: Namespace
metadata:
  name: vpn
  labels:
    name: vpn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nordvpn-proxy
  namespace: vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nordvpn-proxy
  template:
    metadata:
      labels:
        app: nordvpn-proxy
    spec:
      containers:
        - name: nordvpn-proxy
          image: dwilson2547/nordvpn-proxy
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - containerPort: 8118
              name: proxy-server
          env:
            # Networks whose replies must bypass the tunnel: the LAN, and the pod network so in-cluster
            # clients (scrapers, browserless) can use the proxy. Without 10.1.0.0/16, replies to pods
            # went out tun0 and their connections timed out (2026-10-11).
            - name: LOCAL_NETWORK
              value: 192.168.0.0/24,10.1.0.0/16
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: vpn-creds
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpn-creds
                  key: password
          volumeMounts:
            - name: tz-config
              mountPath: /etc/localtime
              readOnly: true
          # Restart the pod when the tunnel is down or Privoxy can't get traffic out (routes via tun0 +
          # a real exit IP; see the image's /app/healthcheck.sh). Generous timings: a server switch
          # takes a couple of minutes, and openvpn itself now gives up on a dead server
          # (--connect-retry-max), so this is the backstop.
          livenessProbe:
            exec:
              command: ["sh", "/app/healthcheck.sh"]
            initialDelaySeconds: 120
            periodSeconds: 300
            timeoutSeconds: 45
            failureThreshold: 2
      dnsConfig:
        nameservers:
          - 103.86.96.100
          - 103.86.99.100
      volumes:
        - name: tz-config
          hostPath:
            path: /usr/share/zoneinfo/Etc/UTC
---
apiVersion: v1
kind: Service
metadata:
  name: nordvpn-proxy-entrypoint
  namespace: vpn
spec:
  type: NodePort
  selector:
    app: nordvpn-proxy
  ports:
    - port: 8118
      targetPort: 8118
      nodePort: 30008