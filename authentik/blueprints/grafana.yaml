# Grafana (https://grafana.danwils.com) as an OIDC client of authentik.
#
# Access is by group only: the application is bound to the three groups below
# (policy_engine_mode any), so a user in none of them is refused by authentik and
# never reaches Grafana. Grafana also sets role_attribute_strict as a second gate.
#
# Grafana sets the role from the groups claim (profile scope) at every sign-in,
# highest wins (monitoring/helm-values/prometheus-values.yaml):
#   grafana-admins   -> GrafanaAdmin (server admin + org Admin)
#   grafana-editors  -> Editor
#   grafana-viewers  -> Viewer
#
# Client secret: hand-applied Secret `authentik-grafana-oidc` (authentik ns); Grafana
# reads the same value from `grafana-oidc` (monitoring ns).
version: 1
metadata:
  name: danwils - Grafana OIDC application
entries:
  - model: authentik_core.group
    id: admins
    identifiers:
      name: grafana-admins
  - model: authentik_core.group
    id: editors
    identifiers:
      name: grafana-editors
  - model: authentik_core.group
    id: viewers
    identifiers:
      name: grafana-viewers

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: grafana
    attrs:
      client_type: confidential
      # Grafana refreshes its OAuth token to keep the session (and re-read groups).
      grant_types:
        - authorization_code
        - refresh_token
      client_id: grafana
      client_secret: !Env [AUTHENTIK_GRAFANA_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.danwils.com/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: https://grafana.danwils.com
      meta_description: Cluster metrics, logs and traces

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 1
    attrs:
      group: !KeyOf editors
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 2
    attrs:
      group: !KeyOf viewers
