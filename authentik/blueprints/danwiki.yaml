# DanWiki (https://danwiki.danwils.com) as an OIDC client of authentik.
#
# Any approved authentik user may sign in (no policy binding): DanWiki keeps its own
# users and per-wiki roles (viewer/editor/admin), and public wikis stay readable
# without signing in. authentik answers "who is this" and owns two site-wide flags,
# set by the app from the groups claim (profile scope) at every sign-in, both ways:
#   danwiki-admins   -> site admin
#   danwiki-creators -> may create wikis (admins always may)
#
# Client secret: hand-applied Secret `authentik-danwiki-oidc` (authentik ns); the app
# reads the same value from `danwiki-oidc` (danwiki ns).
version: 1
metadata:
  name: danwils - DanWiki OIDC application
entries:
  - model: authentik_core.group
    identifiers:
      name: danwiki-admins
  - model: authentik_core.group
    identifiers:
      name: danwiki-creators

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: danwiki
    attrs:
      client_type: confidential
      # Code flow only: the app issues its own tokens and never refreshes authentik's.
      grant_types:
        - authorization_code
      client_id: danwiki
      client_secret: !Env [AUTHENTIK_DANWIKI_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://danwiki.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: danwiki
    attrs:
      name: DanWiki
      provider: !KeyOf provider
      meta_launch_url: https://danwiki.danwils.com
      meta_description: Wiki with semantic search
