# Builds the ConfigMap that authentik/values.yaml mounts as blueprints.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
configMapGenerator:
  - name: authentik-blueprints-danwils
    files:
      - signup.yaml
      - notify-new-users.yaml
      - photo-dump.yaml
      - grafana.yaml
      - danwiki.yaml
      - argocd.yaml
      - dxf-converter.yaml
      - nodewright.yaml
      - webdoc.yaml
      - scrape-job-manager.yaml
generatorOptions:
  disableNameSuffixHash: true
