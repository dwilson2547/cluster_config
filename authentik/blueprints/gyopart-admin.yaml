# gyopart admin (https://gyopart-admin.danwils.com; dev: https://gyopart-admin-dev.danwils.com) as an OIDC
# client of authentik.
#
# Access is by group only: the application is bound to gyopart-admin, so a user outside it is refused by
# authentik and never reaches the admin. The admin has no authorization of its own (every signed-in user can
# create mappings and trigger yard scrapes), so this binding is the only gate. Add members in the authentik UI.
#
# One client for both environments. Client secret: hand-applied Secret `authentik-gyopart-admin-oidc`
# (authentik ns); the admin reads the same value as OIDC_CLIENT_SECRET from `gyopart-admin-oidc` in the
# gyopart and gyopart-dev namespaces.
version: 1
metadata:
  name: danwils - gyopart admin OIDC application
entries:
  - model: authentik_core.group
    id: admins
    identifiers:
      name: gyopart-admin

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: gyopart-admin
    attrs:
      client_type: confidential
      # Code flow only: the app issues its own session cookie and never refreshes authentik's tokens.
      grant_types:
        - authorization_code
      client_id: gyopart-admin
      client_secret: !Env [AUTHENTIK_GYOPART_ADMIN_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://gyopart-admin.danwils.com/api/auth/oidc/callback
        - matching_mode: strict
          url: https://gyopart-admin-dev.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app
    identifiers:
      slug: gyopart-admin
    attrs:
      name: gyopart admin
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: https://gyopart-admin.danwils.com
      meta_description: Junkyard vehicle matching — discrepancies, mappings, yard re-scrapes

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf admins
