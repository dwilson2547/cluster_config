# incident-operator's incident page (https://incident-operator.danwils.com) as an OIDC client of authentik.
#
# Access is by group only: the application is bound to incident-operator-admins, so a user outside it is refused by
# authentik and never reaches the page. Every signed-in user can approve the fixes the operator proposes, so this
# binding is what decides who can. Add members in the authentik admin UI.
#
# Client secret: hand-applied Secret `authentik-incident-operator-oidc` (authentik ns); the page reads the same value
# from `incident-operator-oidc` (incident-operator ns), key client_secret in both. Both are made by
# infra/incident-operator/scripts/create-secrets.sh.
version: 1
metadata:
  name: danwils - incident-operator OIDC application
entries:
  - model: authentik_core.group
    id: admins
    identifiers:
      name: incident-operator-admins

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: incident-operator
    attrs:
      client_type: confidential
      # Code flow only: the page issues its own session cookie and never refreshes authentik's tokens.
      grant_types:
        - authorization_code
      client_id: incident-operator
      client_secret: !Env [AUTHENTIK_INCIDENT_OPERATOR_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://incident-operator.danwils.com/api/auth/oidc/callback
        # LAN page, until the public host is released; then removed.
        - matching_mode: strict
          url: http://incident-operator.cluster.local/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app
    identifiers:
      slug: incident-operator
    attrs:
      name: incident-operator
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: https://incident-operator.danwils.com
      meta_description: Alert triage by a local model, and approving the fixes it proposes

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf admins
