# scrape-job-manager UI (https://sjm.danwils.com) as an OIDC client of authentik.
#
# Access is by group only: the application is bound to sjm-admins, so a user
# outside it is refused by authentik and never reaches the UI. The UI has no
# authorization of its own — every signed-in user can trigger runs — so this
# binding is the only gate. Add members in the authentik admin UI.
#
# Client secret: hand-applied Secret `authentik-sjm-oidc` (authentik ns); the UI
# reads the same value as OIDC_CLIENT_SECRET from `scrape-job-manager-ui-oidc`
# (scrape-job-manager ns).
version: 1
metadata:
  name: danwils - scrape-job-manager OIDC application
entries:
  - model: authentik_core.group
    id: admins
    identifiers:
      name: sjm-admins

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: scrape-job-manager
    attrs:
      client_type: confidential
      # Code flow only: the app issues its own session cookie and never refreshes authentik's tokens.
      grant_types:
        - authorization_code
      client_id: scrape-job-manager
      client_secret: !Env [AUTHENTIK_SJM_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://sjm.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app
    identifiers:
      slug: scrape-job-manager
    attrs:
      name: scrape-job-manager
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: https://sjm.danwils.com
      meta_description: Scraper fleet status, run history and recovery actions

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf admins
