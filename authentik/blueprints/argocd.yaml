# ArgoCD (https://argocd.danwils.com, also http://argocd.local) as an OIDC client of authentik.
#
# Access is by group only: the application is bound to the two groups below
# (policy_engine_mode any), so a user in neither is refused by authentik.
# ArgoCD maps the groups claim (profile scope) to roles in argocd-rbac-cm
# (argocd-server/argocd-rbac-cm-patch.yaml):
#   argocd-admins   -> role:admin
#   argocd-viewers  -> role:readonly
# Membership is managed by hand in authentik, not here.
#
# Client secret: hand-applied Secret `authentik-argocd-oidc` (authentik ns); ArgoCD
# reads the same value from `argocd-oidc-authentik` (argocd ns).
# Full layout: docs/argocd_access.md.
version: 1
metadata:
  name: danwils - ArgoCD OIDC application
entries:
  - model: authentik_core.group
    id: admins
    identifiers:
      name: argocd-admins
  - model: authentik_core.group
    id: viewers
    identifiers:
      name: argocd-viewers

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: argocd
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: argocd
      client_secret: !Env [AUTHENTIK_ARGOCD_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://argocd.danwils.com/auth/callback
        # LAN host (argocd-cm additionalUrls); plain HTTP, never leaves the LAN.
        - matching_mode: strict
          url: http://argocd.local/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: https://argocd.danwils.com
      meta_description: GitOps continuous delivery

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 1
    attrs:
      group: !KeyOf viewers
