# dxf-converter (https://dxf-converter.danwils.com) as an OIDC client of authentik.
#
# Any approved authentik user may sign in (no policy binding): converting is anonymous
# and public; signing in only adds saved scans. The app keeps its own users and owns
# one flag, set from the groups claim (profile scope) at every sign-in, both ways:
#   dxf-converter-admins -> admin (admin panel: users, their content, sign-out, delete)
#
# Client secret: hand-applied Secret `authentik-dxf-converter-oidc` (authentik ns); the
# app reads the same value from `dxf-converter-oidc` (dxf-converter ns).
version: 1
metadata:
  name: danwils - dxf-converter OIDC application
entries:
  - model: authentik_core.group
    identifiers:
      name: dxf-converter-admins

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: dxf-converter
    attrs:
      client_type: confidential
      # Code flow only: the app issues its own tokens and never refreshes authentik's.
      grant_types:
        - authorization_code
      client_id: dxf-converter
      client_secret: !Env [AUTHENTIK_DXF_CONVERTER_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://dxf-converter.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: dxf-converter
    attrs:
      name: DXF converter
      provider: !KeyOf provider
      meta_launch_url: https://dxf-converter.danwils.com
      meta_description: Scans and photos to DXF
