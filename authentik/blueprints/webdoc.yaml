# webdoc (https://webdoc.danwils.com) as an OIDC client of authentik.
#
# Any approved authentik user may sign in (no policy binding). The app keeps its own users,
# matched on (issuer, sub). Members of `webdoc-admins` are webdoc admins: the app reads the
# groups claim (profile scope) at every sign-in. Membership is managed by hand in authentik.
#
# Client secret: hand-applied Secret `authentik-webdoc-oidc` (authentik ns); the app reads the
# same value from `webdoc-oidc` (webdoc ns).
version: 1
metadata:
  name: danwils - webdoc OIDC application
entries:
  - model: authentik_core.group
    identifiers:
      name: webdoc-admins

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: webdoc
    attrs:
      client_type: confidential
      # Code flow only: the app issues its own session cookie and never refreshes authentik's tokens.
      grant_types:
        - authorization_code
      client_id: webdoc
      client_secret: !Env [AUTHENTIK_WEBDOC_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://webdoc.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: webdoc
    attrs:
      name: webdoc
      provider: !KeyOf provider
      meta_launch_url: https://webdoc.danwils.com
      meta_description: Shared notes and documents for people and agents
