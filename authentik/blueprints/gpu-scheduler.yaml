# gpu-scheduler dashboard (https://gpu-scheduler.danwils.com) as an OIDC client of authentik.
#
# Access is by group only: the application is bound to gpu-scheduler-admins, so a user outside it is refused by
# authentik and never reaches the dashboard. The dashboard has no authorization of its own and shows every client's
# jobs, inputs and results, so this binding is the only gate. Add members in the authentik admin UI.
#
# Client secret: hand-applied Secret `authentik-gpu-scheduler-oidc` (authentik ns); the dashboard reads the same
# value from `gpu-scheduler-dashboard-oidc` (gpu-scheduler ns), key client_secret in both.
version: 1
metadata:
  name: danwils - gpu-scheduler dashboard OIDC application
entries:
  - model: authentik_core.group
    id: admins
    identifiers:
      name: gpu-scheduler-admins

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: gpu-scheduler
    attrs:
      client_type: confidential
      # Code flow only: the dashboard issues its own session cookie and never refreshes authentik's tokens.
      grant_types:
        - authorization_code
      client_id: gpu-scheduler
      client_secret: !Env [AUTHENTIK_GPU_SCHEDULER_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://gpu-scheduler.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    id: app
    identifiers:
      slug: gpu-scheduler
    attrs:
      name: gpu-scheduler
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_launch_url: https://gpu-scheduler.danwils.com
      meta_description: GPU queues, model swaps, job stats and request/response browser

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf admins
