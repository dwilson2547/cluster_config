# photo-dump as an OIDC client of authentik.
#
# photo-dump keeps its own users and per-space permissions; authentik answers
# "who is this" and owns the app-wide role. The app links an authentik user to its
# local account by `sub` (first login: by email) and issues its own token.
#
# Role = highest of these groups at each sign-in (groups claim, profile scope);
# none = Viewer. Moving someone between groups takes effect at their next sign-in.
#   photo-dump-admins   -> Admin
#   photo-dump-editors  -> Moderator
#   photo-dump-creators -> User (create spaces, upload, share)
#
# Client secret: hand-applied Secret `authentik-photo-dump-oidc` (authentik ns);
# the app reads the same value from `photo-dump-oidc-creds` (photo-dump ns) and
# `photo-dump-dev-oidc-creds` (photo-dump-dev ns).
version: 1
metadata:
  name: danwils - photo-dump OIDC application
entries:
  - model: authentik_core.group
    identifiers:
      name: photo-dump-admins
  - model: authentik_core.group
    identifiers:
      name: photo-dump-editors
  - model: authentik_core.group
    identifiers:
      name: photo-dump-creators

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: photo-dump
    attrs:
      client_type: confidential
      # Defaults to [] in 2026.8, which refuses every request ("Invalid grant_type
      # for provider"). Code flow only: the app issues its own session token and
      # never refreshes authentik's.
      grant_types:
        - authorization_code
      client_id: photo-dump
      client_secret: !Env [AUTHENTIK_PHOTO_DUMP_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://photo-dump.danwils.com/api/auth/oidc/callback
        # dev (scaled to zero; kept so it can be brought back)
        - matching_mode: strict
          url: http://photo-dump-dev.local/api/auth/oidc/callback
        # Where authentik sends the browser after Logout (RP-initiated logout; the app passes
        # id_token_hint, which authentik requires before it honours post_logout_redirect_uri).
        - matching_mode: strict
          url: https://photo-dump.danwils.com/
          redirect_uri_type: logout
        - matching_mode: strict
          url: http://photo-dump-dev.local/
          redirect_uri_type: logout
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      # RS256 with a published JWKS, so the app verifies ID tokens without the secret.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: photo-dump
    attrs:
      name: Photo Dump
      provider: !KeyOf provider
      meta_launch_url: https://photo-dump.danwils.com
      meta_description: Photo sharing spaces
