# Tell the admins whenever an account is created, so sign-ups held by
# signup.yaml do not sit unnoticed. Delivered by email (Gmail SMTP, see
# values.yaml) and in the authentik UI to the "authentik Admins" group.
version: 1
metadata:
  name: danwils - Notify admins of new accounts
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        path: default/events-default.yaml
      required: true

  - model: authentik_policies_event_matcher.eventmatcherpolicy
    id: match-user-created
    identifiers:
      name: danwils-match-user-created
    attrs:
      action: model_created
      model: authentik_core.user

  - model: authentik_events.notificationrule
    id: notify-user-created
    identifiers:
      name: danwils-notify-user-created
    attrs:
      severity: notice
      group: !Find [authentik_core.group, [name, authentik Admins]]
      transports:
        - !Find [authentik_events.notificationtransport, [name, default-email-transport]]
        - !Find [authentik_events.notificationtransport, [name, default-local-transport]]

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf notify-user-created
      policy: !KeyOf match-user-created
      order: 0
