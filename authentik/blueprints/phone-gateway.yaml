# Phone gateway (robo-services phone_gateway Android app) as an OIDC client of authentik.
#
# Public client + PKCE with a custom-scheme redirect: an app on a phone cannot keep a client secret.
# The app sends its access token (a JWT) as the MQTT password, and the token's `sub` as the username,
# to the public mosquitto listener (mqtt.danwils.com:48213 -> pub-sub mosquitto 8883). mqtt-auth
# (robotics/robo-services/services/mqtt_auth) checks it against this provider's JWKS
# (/application/o/phone-gateway/jwks/): signature, iss, aud = client_id, exp.
#
# Access is by group only: the application is bound to phone-gateway-users, so a user outside it is
# refused at sign-in and never gets a token. Add members in the authentik admin UI.
#
# 30-minute access tokens, refreshed silently by the app; a 7-day refresh token means about one
# interactive sign-in a week.
version: 1
metadata:
  name: danwils - Phone Gateway OIDC application
entries:
  - model: authentik_core.group
    id: users
    identifiers:
      name: phone-gateway-users

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: phone-gateway
    attrs:
      client_type: public
      grant_types:
        - authorization_code
        - refresh_token
      client_id: phone-gateway
      redirect_uris:
        - matching_mode: strict
          url: com.robo.phonegateway:/oauth2redirect
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      access_token_validity: minutes=30
      refresh_token_validity: days=7

  - model: authentik_core.application
    id: app
    identifiers:
      slug: phone-gateway
    attrs:
      name: Phone Gateway
      provider: !KeyOf provider
      policy_engine_mode: any
      meta_description: Android telemetry gateway (BLE dongle -> MQTT)

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf users
