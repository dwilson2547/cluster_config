# nodewright (https://nodewright.danwils.com) as an OIDC client of authentik.
#
# Any approved authentik user may sign in (no policy binding); each user only sees
# their own workspaces. The app keeps its own users, matched on (issuer, sub).
#
# Client secret: hand-applied Secret `authentik-nodewright-oidc` (authentik ns); the
# app reads the same value from `nodewright-oidc` (nodewright ns).
version: 1
metadata:
  name: danwils - nodewright OIDC application
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: nodewright
    attrs:
      client_type: confidential
      # Code flow only: the app issues its own session cookie and never refreshes authentik's tokens.
      grant_types:
        - authorization_code
      client_id: nodewright
      client_secret: !Env [AUTHENTIK_NODEWRIGHT_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: https://nodewright.danwils.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: nodewright
    attrs:
      name: nodewright
      provider: !KeyOf provider
      meta_launch_url: https://nodewright.danwils.com
      meta_description: Diagram editor on JSON Canvas
