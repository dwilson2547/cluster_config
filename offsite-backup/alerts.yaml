# Alerts for the weekly offsite backup (backup.yaml), mailed like the postgres backup alerts. The operator routes an
# AlertmanagerConfig by its own namespace, so this one sits in offsite-backup with its own copy of the SMTP secret
# `alertmanager-smtp` (key SMTP_PASSWORD).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: offsite-backup-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: offsite-backup
      rules:
        - alert: OffsiteBackupJobFailed
          expr: kube_job_status_failed{namespace="offsite-backup", job_name=~"offsite-backup.*"} > 0
          labels:
            severity: critical
          annotations:
            summary: "Offsite backup job {{ $labels.job_name }} failed"
            description: >-
              Check `kubectl -n offsite-backup logs job/{{ $labels.job_name }}`.
        - alert: OffsiteBackupStale
          expr: >-
            time() - kube_cronjob_status_last_successful_time{namespace="offsite-backup", cronjob="offsite-backup"} > 8*86400
            or (kube_cronjob_info{namespace="offsite-backup", cronjob="offsite-backup"}
            unless on(namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="offsite-backup", cronjob="offsite-backup"})
          for: 2d
          labels:
            severity: critical
          annotations:
            summary: "Offsite backup has no successful run in over 8 days"
            description: >-
              The weekly run (Sunday 07:00 ET) is not starting or not succeeding. Check
              `kubectl -n offsite-backup get jobs,cronjobs`.
        - alert: OffsiteBackupSuspended
          expr: kube_cronjob_spec_suspend{namespace="offsite-backup", cronjob="offsite-backup"} == 1
          labels:
            severity: warning
          annotations:
            summary: "Offsite backup CronJob is suspended"
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: offsite-backup-email
  namespace: offsite-backup
spec:
  route:
    receiver: offsite-backup-email
    groupBy:
      - alertname
    matchers:
      - name: alertname
        matchType: =~
        value: "OffsiteBackup.*"
    continue: false
  receivers:
    - name: offsite-backup-email
      emailConfigs:
        - to: dwilson2547@gmail.com
          from: "alertmanager <dwilson2547@gmail.com>"
          smarthost: smtp.gmail.com:587
          authUsername: dwilson2547@gmail.com
          authPassword:
            name: alertmanager-smtp
            key: SMTP_PASSWORD
          requireTLS: true
          sendResolved: true
