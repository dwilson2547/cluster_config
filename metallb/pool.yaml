# The cluster's LoadBalancer address range, announced on the LAN via L2 (ARP).
# Traefik holds .60; see `kubectl get svc -A | grep LoadBalancer` for the rest.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-addresspool
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  addresses:
    - 192.168.0.60-192.168.0.85
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-advertise-all-pools
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
