# Namespace, ServiceAccount, and cluster-wide `list secrets` for the nightly secrets export (backup.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: secrets-backup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-backup
  namespace: secrets-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-backup-reader
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-backup-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-backup-reader
subjects:
  - kind: ServiceAccount
    name: secrets-backup
    namespace: secrets-backup
