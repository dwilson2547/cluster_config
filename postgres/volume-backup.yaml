# Nightly copy of app file volumes (nfs-dataset PVCs on the TrueNAS box) to the Unraid backup share, next to the
# postgres dumps (runbook: docs/postgres_backup.md, "File volumes"). Lives in the postgres namespace to share the
# backup PVC, the SMTP secret and the backup alerts.
#
# Each volume's directory on TrueNAS is mounted read-only through a static PV (a PVC can't be mounted from another
# namespace). The subdir is the app PVC's PV name: if an app's PVC is ever recreated, its data moves to a new subdir
# and the PV here must follow (the old subdir is deleted with the PVC, so the mount fails and the job alerts).
#
#   /backups/volumes/<name>/<db>-<stamp>.db        SQLite volumes: online backup (consistent while the app writes),
#                                                  28 days kept
#   /backups/volumes/<name>/current/               file volumes: mirror (rclone sync)
#   /backups/volumes/<name>/replaced/<stamp>/      files a run overwrote or deleted from current/, 28 days kept
#   /backups/volumes/.last-success
apiVersion: v1
kind: PersistentVolume
metadata:
  name: volume-backup-web-workflows
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-backup
  mountOptions: [hard, nfsvers=4.1]
  claimRef: {name: volume-backup-web-workflows, namespace: postgres}
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: volume-backup-web-workflows
    # web-workflows/web-workflows-db
    volumeAttributes: {server: 192.168.0.10, share: /mnt/ssd_pool/nfs_dataset, subdir: pvc-a38f8eaa-f675-413b-9d52-f5b00ce82c25}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: volume-backup-build-sim
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-backup
  mountOptions: [hard, nfsvers=4.1]
  claimRef: {name: volume-backup-build-sim, namespace: postgres}
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: volume-backup-build-sim
    # build-sim/build-sim-data
    volumeAttributes: {server: 192.168.0.10, share: /mnt/ssd_pool/nfs_dataset, subdir: pvc-f4ed26b7-c0fc-4635-8903-8a4023cf0596}
---
apiVersion: v1
kind: PersistentVolume
