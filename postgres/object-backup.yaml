# Nightly copy of object-store buckets to the Unraid backup share, next to the postgres dumps (postgres/backup.yaml; runbook docs/postgres_backup.md). Lives in the postgres
# namespace to share that PVC, the SMTP secret and the backup alerts.
#
# BUCKETS lists <remote>:<bucket> entries; a remote is defined by RCLONE_CONFIG_<REMOTE>_* env vars below
# (aistor = AIStor on the TrueNAS box, 192.168.0.10:30320). Per bucket:
#   /backups/objects/<bucket>/current/                 mirror of the bucket (rclone sync)
#   /backups/objects/<bucket>/replaced/<stamp>/        objects a run overwrote or deleted from current/, kept 28 days
#   /backups/objects/.last-success                     stamp of the last run where every bucket synced
# so a deletion or overwrite in the bucket stays recoverable for 28 days. --max-delete stops a run that would
# remove more than MAX_DELETE objects (a wrong key or an emptied bucket), before it touches current/.
#
# Only the FULL_SYNC_DOW run (Wednesday, away from Sunday's restore tests) is a full `rclone sync`, with 2 checkers. The other nights copy objects modified in the last
# 26h with --no-traverse, so they never walk current/. A full sync of part-images (~6.9M objects) is ~14M metadata
# lookups on one spinning disk behind Unraid's FUSE layer. That pegged the disk at 100% for 2h a night and stalled
# every NFS client of the share (docs/issues/2026_10_18_unraid_nfs_v41_client_wedge.md, "Recurrence"). Deletions
# in a bucket therefore reach current/ (and replaced/) on Wednesday, not the same night. Fewer checkers make the
# weekly walk slower but leave the disk room for other clients' requests.
#
# Credentials: hand-applied secret `object-backup-s3` (keys S3_ACCESS_KEY, S3_SECRET_KEY), a read-only AIStor
# access key scoped to the listed buckets; template in example-secrets/postgres/object-backup-s3.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-objects-script
  namespace: postgres
data:
  backup-objects.sh: |
    #!/bin/sh
    set -eu
    STAMP=$(date -u +%Y%m%d-%H%M%S)
    ROOT=/backups/objects
    mkdir -p "$ROOT"
    failed=""
    full=${FULL_SYNC:-0}
    [ "$(date -u +%w)" = "$FULL_SYNC_DOW" ] && full=1
    for entry in $BUCKETS; do
      b=${entry#*:}
      mkdir -p "$ROOT/$b/current"
      if [ "$full" = 1 ]; then
        echo "== $entry (full sync)"
        set -- sync --max-delete "$MAX_DELETE" --checkers 2
      else
        echo "== $entry (objects modified in the last 26h)"
        set -- copy --max-age 26h --no-traverse --use-server-modtime --checkers 8
      fi
      if rclone "$@" "$entry" "$ROOT/$b/current" \
          --backup-dir "$ROOT/$b/replaced/$STAMP" \
          --list-cutoff 200000 --transfers 4 \
          --stats-one-line --stats 5m -v; then
        # Sized from the bucket, not current/ (walking current/ is the load this schedule avoids), and only on the
        # full run: listing part-images for its size takes ~85 min even from AIStor.
        [ "$full" = 1 ] && echo "   $(rclone size --json "$entry")"
        :
      else
        echo "   FAILED: $b"
        failed="$failed $b"
      fi
      # Keep 28 days of replaced/deleted objects.
      find "$ROOT/$b/replaced" -mindepth 1 -maxdepth 1 -type d -mtime +28 -exec rm -rf {} + 2>/dev/null || true
    done
    if [ -n "$failed" ]; then
      echo "failed buckets:$failed"
      exit 1
    fi
    date -u +%Y-%m-%dT%H:%M:%SZ > "$ROOT/.last-success"
    echo "all buckets synced"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-objects
  namespace: postgres
  labels:
    app: backup-objects
spec:
  schedule: "15 3 * * *"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          # The Unraid export squashes to 99:100 (docs/postgres_backup.md, gotchas).
          securityContext:
            runAsUser: 99
            runAsGroup: 100
          containers:
            - name: backup
              image: rclone/rclone:1.71.1
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/backup-objects.sh"]
              env:
                # <remote>:<bucket>, space-separated: nodewright attachments and photo-dump's photos (moved from the
                # old MinIO 2026-10-16). part-images (~6.9M objects) is left out: any walk of its copy on this share
                # stalls Tower's NFS, so it is backed up only offsite, straight from AIStor
                # (offsite-backup/objects.yaml). Its last copy here (2026-10-22) is stale from then on.
                - {name: BUCKETS, value: "aistor:nodewright aistor:photo-dump-prod aistor:photo-dump-dev"}
                - {name: MAX_DELETE, value: "500"}
                # Day (date +%w, UTC; the 03:15 ET run is the same day in UTC) of the weekly full sync.
                - {name: FULL_SYNC_DOW, value: "3"}
                - {name: HOME, value: /tmp}
                - {name: RCLONE_CONFIG, value: /tmp/rclone.conf}
                - {name: RCLONE_CONFIG_AISTOR_TYPE, value: s3}
                - {name: RCLONE_CONFIG_AISTOR_PROVIDER, value: Minio}
                - {name: RCLONE_CONFIG_AISTOR_ENDPOINT, value: "http://192.168.0.10:30320"}
                - name: RCLONE_CONFIG_AISTOR_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: object-backup-s3, key: S3_ACCESS_KEY}}
                - name: RCLONE_CONFIG_AISTOR_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: object-backup-s3, key: S3_SECRET_KEY}}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 2Gi}
              volumeMounts:
                - {name: backup, mountPath: /backups}
                - {name: scripts, mountPath: /scripts}
                # rclone >= 1.70 sorts listings above --list-cutoff here instead of in memory: part-images keeps
                # millions of objects per flat folder (1.68 needed > 8 GiB for one).
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
            - name: scripts
              configMap:
                name: backup-objects-script
            - name: tmp
              emptyDir: {sizeLimit: 20Gi}
