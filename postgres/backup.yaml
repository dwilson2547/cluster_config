---
# Automated logical backups for the prod postgres instances.
#
# Target: the Unraid NFS export 192.168.0.15:/mnt/user/cluster_backup (distinct box from
# the live data on 192.168.0.10). The export squashes to uid 99 / gid 100, so the backup
# pods run as 99:100.
#
# Layout on the share:
#   /backups/<instance>/<db>/<db>-<YYYYMMDD-HHMMSS>.dump   pg_dump custom format
#   /backups/<instance>/globals-<YYYYMMDD-HHMMSS>.sql      roles/grants (pg_dumpall globals)
#   /backups/<instance>/.last-success                      stamp of the last clean run
# File name stamps are UTC (containers run in UTC); CronJob schedules are America/New_York.
#
# Retention: every dump kept for 7 days; Sunday dumps kept for 28 days; everything else
# pruned.
#
# Each instance gets its own CronJob with a version-matched client image. The pgvector
# instance is PostgreSQL 16 and must be dumped/restored with the pgvector/pgvector:pg16
# image: a v17 pg_restore emits `SET transaction_timeout`, which a v16 server rejects
# (see docs/issues/2026_10_15_pgvector_restore_transaction_timeout.md).
#
# The private-namespace objects carry an explicit metadata.namespace because that
# namespace is not otherwise ArgoCD-managed; ArgoCD honors manifest namespaces over the
# Application's destination namespace.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-backup-nfs
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-backup
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    name: postgres-backup
    namespace: postgres
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.0.15-cluster-backup-postgres
    volumeAttributes:
      server: 192.168.0.15
      share: /mnt/user/cluster_backup
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-backup-nfs-private
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-backup
  mountOptions:
    - hard
    - nfsvers=4.1
  claimRef:
    name: postgres-backup
    namespace: private
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.0.15-cluster-backup-private
    volumeAttributes:
      server: 192.168.0.15
      share: /mnt/user/cluster_backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: postgres
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-backup
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: private
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-backup
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-scripts
  namespace: postgres
data:
  backup.sh: |
    #!/bin/bash
    # Generic single-instance backup script. Driven by env:
    #   INSTANCE_DIR  subdirectory under /backups for this instance
    #   PGHOST        postgres service to back up
    #   PGUSER / PGPASSWORD  credentials
    set -u
    ROOT=/backups
    STAMP=$(date -u +%Y%m%d-%H%M%S)
    DAILY_KEEP=7
    WEEKLY_KEEP=28
    root_dir="$ROOT/$INSTANCE_DIR"
    instance_failures=0
    mkdir -p "$root_dir"

    echo "[$INSTANCE_DIR] dumping globals"
    if ! pg_dumpall -h "$PGHOST" --globals-only > "$root_dir/globals-$STAMP.sql"; then
      echo "[$INSTANCE_DIR] FAILED: globals dump"
      instance_failures=$((instance_failures + 1))
    fi

    if ! dbs=$(psql -h "$PGHOST" -At -c "SELECT datname FROM pg_database WHERE NOT datistemplate AND datallowconn AND datname <> 'postgres' AND left(datname, 14) <> '_restore_test_' ORDER BY 1"); then
      echo "[$INSTANCE_DIR] FAILED: database enumeration"
      exit 1
    fi

    for db in $dbs; do
      echo "[$INSTANCE_DIR] dumping $db"
      mkdir -p "$root_dir/$db"
      if pg_dump -h "$PGHOST" -Fc -d "$db" -f "$root_dir/$db/$db-$STAMP.dump"; then
        echo "[$INSTANCE_DIR] $db -> $(du -h "$root_dir/$db/$db-$STAMP.dump" | cut -f1)"
      else
        echo "[$INSTANCE_DIR] FAILED: $db dump"
        rm -f "$root_dir/$db/$db-$STAMP.dump"
        instance_failures=$((instance_failures + 1))
      fi
    done

    if [ "$instance_failures" -eq 0 ]; then
      echo "$STAMP" > "$root_dir/.last-success"
    fi

    now=$(date +%s)
    for f in "$root_dir"/*/*.dump "$root_dir"/globals-*.sql; do
      [ -e "$f" ] || continue
      mtime=$(stat -c %Y "$f")
      age=$(( (now - mtime) / 86400 ))
      if [ "$age" -le "$DAILY_KEEP" ]; then
        continue
      fi
      wd=$(date -d "@$mtime" +%w)
      if [ "$wd" = "0" ] && [ "$age" -le "$WEEKLY_KEEP" ]; then
        continue
      fi
      echo "[$INSTANCE_DIR] pruning $(basename "$f")"
      rm -f "$f"
    done

    if [ "$instance_failures" -gt 0 ]; then
      echo "backup completed with $instance_failures failures"
      exit 1
    fi
    echo "backup completed cleanly"
  restore-test.sh: |
    #!/bin/bash
    # Generic single-instance restore test: restores the newest dump of every database
    # into a _restore_test_ scratch DB, verifies nonzero user tables, drops the scratch
    # DB. Reads /backups read-only; only touches the postgres server.
    set -u
    ROOT=/backups
    FAILURES=0

    for dbdir in "$ROOT/$INSTANCE_DIR"/*/; do
      [ -d "$dbdir" ] || continue
      db=$(basename "$dbdir")
      dump=$(ls -1t "$dbdir"/*.dump 2>/dev/null | head -n 1)
      if [ -z "$dump" ]; then
        echo "[$INSTANCE_DIR] $db: no dumps found, skipping"
        continue
      fi
      target="_restore_test_$db"
      dropdb -h "$PGHOST" --if-exists "$target" 2>/dev/null
      if ! createdb -h "$PGHOST" "$target"; then
        echo "[$INSTANCE_DIR] $db: FAILED to create scratch database"
        FAILURES=$((FAILURES + 1))
        continue
      fi
      if pg_restore -h "$PGHOST" --exit-on-error -d "$target" "$dump"; then
        tables=$(psql -h "$PGHOST" -d "$target" -At -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog', 'information_schema')")
        if [ "$tables" -gt 0 ]; then
          echo "[$INSTANCE_DIR] $db: restore OK from $(basename "$dump") ($tables tables)"
        else
          echo "[$INSTANCE_DIR] $db: restore left zero user tables"
          FAILURES=$((FAILURES + 1))
        fi
      else
        echo "[$INSTANCE_DIR] $db: FAILED restore from $(basename "$dump")"
        FAILURES=$((FAILURES + 1))
      fi
      dropdb -h "$PGHOST" --if-exists "$target"
    done

    if [ "$FAILURES" -gt 0 ]; then
      echo "restore test completed with $FAILURES failures"
      exit 1
    fi
    echo "restore test completed cleanly"
---
